server:
  port: 8080

spring:
  application:
    name: bookinstant-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookinstant_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:praveen26}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

redisson:
  address: ${REDISSON_ADDRESS:redis://127.0.0.1:6379}
  password: ${REDIS_PASSWORD:}
  timeout: 3000
  connection-pool-size: 64
  connection-minimum-idle-size: 10

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 86400000 # 24 hours

logging:
  level:
    com.bookinstant: INFO
    org.springframework.security: WARN

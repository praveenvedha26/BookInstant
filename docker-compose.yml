services:
  postgres:
    image: postgres:16-alpine
    container_name: bookinstant_postgres
    environment:
      POSTGRES_DB: bookinstant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: praveen26
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bookinstant_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookinstant_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookinstant_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: praveen26
      REDISSON_ADDRESS: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookinstant_postgres
    environment:
      POSTGRES_DB: bookinstant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: praveen26
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bookinstant_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
